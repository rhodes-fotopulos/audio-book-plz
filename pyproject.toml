[project]
name = "audio-book-plz"
version = "0.1.0"
description = "Convert EPUB files into multi-voice audiobooks"
requires-python = ">=3.11,<3.12"
dependencies = [
    "EbookLib>=0.20",
    "beautifulsoup4>=4.14",
    "lxml>=5.0",
    "nltk>=3.8",
    "typer>=0.24",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
