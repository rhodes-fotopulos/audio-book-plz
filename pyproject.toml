[project]
name = "audio-book-plz"
version = "0.1.0"
description = "Convert EPUB files into multi-voice audiobooks"
requires-python = ">=3.11,<3.12"
dependencies = [
    "EbookLib>=0.20",
    "beautifulsoup4>=4.14",
    "lxml>=5.0",
    "nltk>=3.8",
    "typer>=0.24",
    "rich>=13.0",
    "ollama>=0.6",
    "pydantic>=2.0",
    "sentence-transformers>=3.0",
    "chatterbox-tts>=0.1.6",
    "mlx-audio>=0.3.1",  # Qwen3-TTS via MLX for Apple Silicon TTS
    "soundfile>=0.12",
    "pydub>=0.25.1",
    "pyloudnorm>=0.2.0",
    "mutagen>=1.47.0",
    "psutil>=5.9",
    "pedalboard>=0.9.19",  # Spotify audio effects chain for mastering
    "Resemblyzer>=0.1.3",  # Speaker embedding verification via GE2E
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
